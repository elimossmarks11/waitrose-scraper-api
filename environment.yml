name: food
channels:
  - conda-forge
  - defaults
dependencies:
  # Core
  - python=3.12
  - ipykernel
  - ipython
  
  # Data collection (Part A: Scraper)
  - requests
  - scrapy
  - selenium
  
  # Data manipulation (Both)
  - numpy
  - pandas
  
  # API development (Part B: API)
  - fastapi
  - pydantic
  - uvicorn
  - httpx
  
  # Testing (Both)
  - pytest
  - tqdm

  # Pipeline orchestration
  - click

  # Excel Loading
  - openpyxl